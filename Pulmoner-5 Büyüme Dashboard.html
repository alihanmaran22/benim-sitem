 const sumTxt=`<b>${pn}</b> ${S.t?S.t+' bölgesinde':'tüm bölgede'} 2026 ilk 9 ayda <b>${f(B)}</b> adet (<b class="${cl(gA)}">${pc(gA)}</b>), ilgili pazar ise <b class="${cl(mgA)}">${pc(mgA)}</b>. Pazar payı ${pt(MA?A/MA:0)} → ${pt(MB?B/MB:0)} (${dS>=0?'+':''}${dS.toFixed(2).replace('.',',')} puan). ${gA!=null&&mgA!=null&&gA>mgA?'Pazardan hızlı büyüyoruz.':'Pazarın gerisinde kalıyoruz.'} ${win.length} brick'te pay kazandık (toplam ${sg(win.reduce((a,x)=>a+x.e,0))} adet), ${lose.length} brick'te pay kaybettik (toplam ${sg(lose.reduce((a,x)=>a+x.e,0))} adet).`+(T.length>1?` Pay etkisine göre en iyi TST <b>${T[0].t}</b> (${sg(T[0].e)} adet), en zayıf <b>${T[T.length-1].t}</b> (${sg(T[T.length-1].e)} adet).`:'');
 const Q=[['Pazar büyürken pay kazanan','Pazardaki artıştan fazlasını almışız, bu brick\'lerde ivmeyi koruyalım.',x=>x.mb>x.ma&&x.e>0],['Pazar büyürken pay kaybeden','Pazar büyüyor ama biz geride kaldık. En büyük kaçan fırsat burada.',x=>x.mb>x.ma&&x.e<0],['Pazar küçülürken pay kazanan','Pazar daralırken bile direnmişiz, rakipten pay almışız.',x=>x.mb<=x.ma&&x.e>0],['Pazar küçülürken pay kaybeden','Pazar da biz de küçülmüşüz, öncelikli takip listesi.',x=>x.mb<=x.ma&&x.e<0]];
 const qc=Q.map(([h,d,fn])=>{const l=bk.filter(fn).sort((x,y)=>Math.abs(y.e)-Math.abs(x.e));const tot=l.reduce((a,x)=>a+x.e,0);return `<div class="card"><div class="qh"><h2>${h}</h2><b class="${cl(tot)}">${l.length} brick · ${sg(tot)}</b></div><div class="sm" style="margin:0 0 8px">${d}</div><div class="list">${l.slice(0,6).map(x=>`<div><span>${x.n} <span class="sm">· ${x.t}</span></span><b class="${cl(x.e)}">${sg(x.e)}</b></div>`).join('')||'<div>–</div>'}</div></div>`}).join('');
 const li=a=>a.map(x=>`${x.n} (${sg(x.e)} adet, ürün ${pc(x.g)})`).join('; ')||'–';
 const tc=T.map((x,i)=>`<div class="card"><div class="qh"><h2><span class="rk">${i+1}</span>${x.t}</h2><b class="${cl(x.e)}">${sg(x.e)} adet pay etkisi</b></div><div>${pn} <b class="${cl(x.g)}">${pc(x.g)}</b> · pazar <b class="${cl(x.mg)}">${pc(x.mg)}</b> · pay ${pt(x.s25)} → ${pt(x.s26)}</div><p class="sm">${x.g!=null&&x.mg!=null&&x.g>x.mg?'Pazardan hızlı büyüyor, pay kazanıyor.':'Pazarın gerisinde kalıyor, pay kaybediyor.'}<br><b>Güçlü:</b> ${li(x.bs.filter(b=>b.e>0).slice(0,2))}<br><b>Dikkat:</b> ${li(x.bs.filter(b=>b.e<0).slice(-2).reverse())}</p></div>`).join('');
 $('p3').innerHTML=`<div class="card sum"><h2>Yorum · ${G.cols[p]} (${S.g})</h2><div>${sumTxt}</div><p class="sm">Pay etkisi (adet) = 2026 satışı − 2025 satışı × pazar büyüme çarpanı. Pozitifse pazarın büyümesinden fazlasını almışız, negatifse pazara göre pay vermişiz demektir.</p></div><div class="grid mt">${qc}</div><h2 class="mt" style="font-size:15px">TST bazında yorumlar (pay etkisine göre sıralı)</h2><div class="grid">${tc}</div>`;
}
const _r=render;render=function(){_r();yorum()};
setup();render();
</script></body></html>
